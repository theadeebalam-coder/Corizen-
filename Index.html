<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corizen - Elite Stationery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF9F6; }
        .product-card { border-radius: 40px; background-color: #F2F3EE; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center bg-white sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-[#1A362D] rounded-full flex items-center justify-center text-white font-bold text-xl">C</div>
            <div>
                <h1 class="font-bold text-xl leading-none text-[#1A362D]">Corizen</h1>
                <span class="text-[10px] tracking-widest uppercase text-gray-400">Elite Stationery</span>
            </div>
        </div>
        <button onclick="toggleAdmin()" id="adminBtn" class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-tighter">Staff Login</button>
    </header>

    <main class="max-w-md mx-auto p-6">
        <div class="mt-8 mb-10">
            <h2 class="text-4xl font-extrabold leading-tight">Curating your</h2>
            <h2 class="text-4xl font-extrabold text-gray-300">perfect desk.</h2>
        </div>

        <div id="adminPanel" class="hidden bg-white border-2 border-dashed border-green-800 p-6 rounded-3xl mb-8">
            <h3 class="font-bold mb-4">Shopify Admin Dashboard</h3>
            <div class="space-y-3">
                <input type="text" id="pName" placeholder="Product Name" class="w-full p-3 bg-gray-50 rounded-xl outline-none border">
                <input type="number" id="pPrice" placeholder="Price (₹)" class="w-full p-3 bg-gray-50 rounded-xl outline-none border">
                <input type="text" id="pImg" placeholder="Image URL (Direct link)" class="w-full p-3 bg-gray-50 rounded-xl outline-none border">
                <button onclick="saveProduct()" class="w-full bg-[#1A362D] text-white py-3 rounded-xl font-bold">Upload to Store</button>
            </div>
        </div>

        <div id="productGrid" class="space-y-12">
            </div>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-10 py-5 rounded-full flex gap-12 shadow-2xl items-center z-50">
        <span class="text-xl">🏠</span>
        <span class="text-xl opacity-40">👤</span>
        <span class="text-xl opacity-40 relative">🛒 <b class="absolute -top-2 -right-2 bg-green-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</b></span>
    </nav>

    <script>
        // Shopify Logic: Data management
        let products = JSON.parse(localStorage.getItem('corizen_data')) || [
            { id: 1, name: 'Lined Notebook', price: 199, img: 'https://via.placeholder.com/150' }
        ];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="relative">
                    <div class="product-card p-12 flex justify-center items-center h-80 overflow-hidden">
                        <img src="${p.img}" class="w-32 transition-transform hover:scale-110 duration-500">
                    </div>
                    <div class="mt-4 flex justify-between items-end px-2">
                        <div>
                            <h3 class="font-bold text-lg">${p.name}</h3>
                            <p class="text-[10px] uppercase text-gray-400 font-bold tracking-widest">Handmade in India</p>
                        </div>
                        <p class="text-xl font-bold">₹${p.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleAdmin() {
            let pass = prompt("Enter Admin Password:");
            if(pass === "admin123") {
                document.getElementById('adminPanel').classList.toggle('hidden');
                document.getElementById('adminBtn').innerText = "Logout";
            } else {
                alert("Wrong password!");
            }
        }

        function saveProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value;

            if(name && price && img) {
                products.push({ id: Date.now(), name, price, img });
                localStorage.setItem('corizen_data', JSON.stringify(products));
                renderProducts();
                alert("Product Added to Corizen Store!");
            }
        }

        renderProducts();
    </script>
</body>
</html>
